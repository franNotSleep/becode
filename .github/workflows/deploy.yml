# Push to main -> an image on GHCR -> Watchtower picks it up on the box at 04:00.
#
# There is no deploy step here on purpose: nothing in this workflow can reach the server. The
# server pulls. That is the whole point of the Watchtower arrangement — no SSH key in CI.

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The checks that need no network and no token. `check:policy` exercises the judge against a
      # live model, so it stays a thing you run by hand.
      - run: pnpm check:reads
      - run: pnpm check:gate
      - run: pnpm check:shell
      - run: pnpm check:boot
      - run: pnpm check:attachments
      - run: pnpm check:tokens
      - run: pnpm check:suggestions

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `github.repository` keeps the owner's capitalisation — franNotSleep/becode — and a Docker
      # reference must be lowercase, so buildx refuses the tag before it builds anything. The
      # owner is the only part that can carry a capital, but lowercase the whole string: it is
      # what `docker pull` and `deploy/docker-compose.yml` already spell.
      - id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :main is what the server tracks; the sha tag is how you pin a rollback.
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:main
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
